<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>ElitenMK2 Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="site-wrap">
    <nav class="site-nav">
      <div class="nav-header">Eliten<span>MK2</span></div>
      <ul>
        <li class="{{ 'active' if request.endpoint == 'index' else '' }}">
          <a href="/">Hjem</a>
        </li>
        <li class="{{ 'active' if request.endpoint in ['brugere', 'bruger_detail'] else '' }}">
          <a href="/brugere">Brugere</a>
        </li>
        <li class="{{ 'active' if request.endpoint == 'grupper' else '' }}">
          <a href="/grupper">Grupper</a>
        </li>
        <li class="{{ 'active' if request.endpoint == 'server' else '' }}">
          <a href="/server">Server</a>
        </li>
      </ul>
      {% if current_user.is_authenticated %}
      <div class="nav-footer">
        Logget ind som <strong>{{ current_user.id }}</strong><br>
        <a href="/logout">Log ud</a>
      </div>
      {% endif %}
    </nav>
    <main>{% block content %}{% endblock %}</main>
  </div>
</body>
</html>
