{% extends 'base.html' %}
{% block content %}
<h1>Brugere ({{ users | length }})</h1>
<input type="text" id="search" data-table="bruger-tabel" placeholder="Søg bruger...">
<table id="bruger-tabel">
  <tr>
    <th>Navn</th>
    <th>Brugernavn</th>
    <th>Afdeling</th>
    <th>Status</th>
  </tr>
  {% for u in users %}
  <tr>
    <td>{{ u.navn }}</td>
    <td>{{ u.brugernavn }}</td>
    <td>{{ u.afdeling }}</td>
    <td class="{{ 'aktiv' if u.aktiv else 'inaktiv' }}">{{ 'Aktiv' if u.aktiv else 'Inaktiv' }}</td>
  </tr>
  {% endfor %}
</table>
<script src="{{ url_for('static', filename='search.js') }}"></script>
{% endblock %}
